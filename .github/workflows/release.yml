# release.yml — what happens after a pull request is merged.
#
# The version comes from the TAG, never from a commit. `main` requires signed
# commits with enforce_admins on, and giving CI a signing key would put a
# credential outside the machine that owns this project — so CI creates tags and
# builds with `-ldflags "-X main.version=$TAG"`, and never pushes a commit here.
# `cli/cmd/drift/main.go`'s `var version` is a development fallback only; the
# shipped binary always reports the tag it was cut from.
#
# Triggered on the PR closing rather than on a push to main, because
# `github.event.pull_request.head.ref` gives the branch name directly. Parsing it
# out of a merge commit breaks the moment someone squash-merges.
#
# cli/ and sdk/ are separate modules on separate version lines and are tagged
# independently: cli/vX.Y.Z and sdk/vX.Y.Z. Go resolves a subdirectory module by
# prefixed tag, and a bare vX.Y.Z is SILENTLY IGNORED rather than rejected.

name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      module:
        description: "Module to release"
        required: true
        type: choice
        options: [cli, sdk, both]
      bump:
        description: "Version bump"
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  plan:
    name: Decide what to release
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.plan.outputs.cli }}
      sdk: ${{ steps.plan.outputs.sdk }}
      bump: ${{ steps.plan.outputs.bump }}
      cli_version: ${{ steps.ver.outputs.cli_version }}
      sdk_version: ${{ steps.ver.outputs.sdk_version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - id: plan
        name: Which modules, which bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            m="${{ inputs.module }}"
            [ "$m" = "cli"  ] || [ "$m" = "both" ] && echo "cli=true"  >> "$GITHUB_OUTPUT" || echo "cli=false" >> "$GITHUB_OUTPUT"
            [ "$m" = "sdk"  ] || [ "$m" = "both" ] && echo "sdk=true"  >> "$GITHUB_OUTPUT" || echo "sdk=false" >> "$GITHUB_OUTPUT"
            echo "bump=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ref="${{ github.event.pull_request.head.ref }}"
          case "$ref" in
            feature/*)  bump=minor ;;
            bugfix/*)   bump=patch ;;
            breaking/*) bump=major ;;
            *)          echo "branch '$ref' is not a release branch — nothing to do"
                        echo "cli=false" >> "$GITHUB_OUTPUT"
                        echo "sdk=false" >> "$GITHUB_OUTPUT"
                        echo "bump=none" >> "$GITHUB_OUTPUT"
                        exit 0 ;;
          esac
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          echo "$changed" | grep -q '^cli/' && echo "cli=true" >> "$GITHUB_OUTPUT" || echo "cli=false" >> "$GITHUB_OUTPUT"
          echo "$changed" | grep -q '^sdk/' && echo "sdk=true" >> "$GITHUB_OUTPUT" || echo "sdk=false" >> "$GITHUB_OUTPUT"

      - id: ver
        name: Compute next versions
        run: |
          # While below 1.0 a "major" bump moves the MINOR: burning v1.0.0 on the
          # first breaking change during a closed alpha is not what breaking/ means.
          next() {
            prefix="$1"; bump="$2"
            last=$(git tag -l "${prefix}/v*" | sed "s|^${prefix}/v||" \
                   | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            [ -z "$last" ] && last="0.0.0"
            IFS=. read -r MA MI PA <<EOF
          $last
          EOF
            case "$bump" in
              major) if [ "$MA" -eq 0 ]; then MI=$((MI+1)); PA=0; else MA=$((MA+1)); MI=0; PA=0; fi ;;
              minor) MI=$((MI+1)); PA=0 ;;
              patch) PA=$((PA+1)) ;;
            esac
            echo "v${MA}.${MI}.${PA}"
          }
          b="${{ steps.plan.outputs.bump }}"
          if [ "$b" != "none" ]; then
            echo "cli_version=$(next cli "$b")" >> "$GITHUB_OUTPUT"
            echo "sdk_version=$(next sdk "$b")" >> "$GITHUB_OUTPUT"
          fi

  cli:
    name: Release the CLI
    needs: plan
    if: needs.plan.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: cli/go.mod, cache-dependency-path: cli/go.sum }

      - name: Build every platform
        working-directory: cli
        env:
          VERSION: ${{ needs.plan.outputs.cli_version }}
        run: |
          mkdir -p dist
          # darwin/amd64 is still built: Homebrew supports Intel Macs, and a
          # missing slice means `brew install` fails on that arch rather than
          # falling back.
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            echo "building $os/$arch"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
                       -o "dist/drift" ./cmd/drift
            tar -czf "dist/drift_${VERSION}_${os}_${arch}.tar.gz" -C dist drift
            rm dist/drift
          done
          cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt

      - name: Verify the binary reports the tag
        working-directory: cli
        env:
          VERSION: ${{ needs.plan.outputs.cli_version }}
        run: |
          # The whole point of ldflags versioning is that the binary and the tag
          # cannot disagree. Prove it rather than assume it.
          CGO_ENABLED=0 go build -ldflags "-X main.version=${VERSION}" -o /tmp/drift ./cmd/drift
          got=$(/tmp/drift --version | head -1 | awk '{print $2}')
          [ "$got" = "$VERSION" ] || { echo "✗ binary says '$got', tag is '$VERSION'"; exit 1; }
          echo "✓ binary reports $got"

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.cli_version }}
        run: |
          tag="cli/${VERSION}"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" \
            --title "cli ${VERSION}" \
            --notes "Released from ${{ github.event.pull_request.html_url || 'workflow_dispatch' }}

          Install:

              brew install ondrift/tap/drift

          or:

              go install github.com/ondrift/cloud/cli/cmd/drift@${VERSION}" \
            cli/dist/*.tar.gz cli/dist/checksums.txt

      - name: Update the Homebrew formula
        env:
          VERSION: ${{ needs.plan.outputs.cli_version }}
        run: |
          mkdir -p ~/.ssh && echo "${{ secrets.TAP_DEPLOY_KEY }}" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes"
          git clone -q git@github.com:ondrift/homebrew-tap.git /tmp/tap

          sha() { grep " drift_${VERSION}_$1.tar.gz\$" cli/dist/checksums.txt | awk '{print $1}'; }
          base="https://github.com/ondrift/cloud/releases/download/cli%2F${VERSION}"
          mkdir -p /tmp/tap/Formula
          cat > /tmp/tap/Formula/drift.rb <<RUBY
          # GENERATED by ondrift/cloud .github/workflows/release.yml — do not edit.
          # Hand edits survive only until the next release overwrites this file.
          class Drift < Formula
            desc "CLI for Drift — the European serverless platform"
            homepage "https://ondrift.eu"
            version "${VERSION#v}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/drift_${VERSION}_darwin_arm64.tar.gz"
                sha256 "$(sha darwin_arm64)"
              end
              on_intel do
                url "${base}/drift_${VERSION}_darwin_amd64.tar.gz"
                sha256 "$(sha darwin_amd64)"
              end
            end

            on_linux do
              on_arm do
                url "${base}/drift_${VERSION}_linux_arm64.tar.gz"
                sha256 "$(sha linux_arm64)"
              end
              on_intel do
                url "${base}/drift_${VERSION}_linux_amd64.tar.gz"
                sha256 "$(sha linux_amd64)"
              end
            end

            def install
              bin.install "drift"
            end

            test do
              assert_match "drift ${VERSION}", shell_output("#{bin}/drift --version")
            end
          end
          RUBY

          cd /tmp/tap
          git config user.name "drift-ci"
          git config user.email "isrand@protonmail.com"
          git add Formula/drift.rb
          git commit -m "drift ${VERSION}

          Generated from ondrift/cloud@${GITHUB_SHA::12}."
          git push origin HEAD:main
          echo "✓ formula updated to ${VERSION}"

  sdk:
    name: Release the SDK
    needs: plan
    if: needs.plan.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.sdk_version }}
        run: |
          # No binaries: the SDK is consumed as source by six language
          # toolchains, and the tag is the whole release. Registry publishing
          # (npm/PyPI/RubyGems/crates.io) is still a separate manual step —
          # note drift-sdk on PyPI is taken by an unrelated project.
          tag="sdk/${VERSION}"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --title "sdk ${VERSION}" \
            --notes "Six languages, one version. Consumed as source; the CLI resolves it at deploy time."
