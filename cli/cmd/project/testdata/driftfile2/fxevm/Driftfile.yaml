slice: fxevm-testnode

atomic:
  elements:
    - name: evm
      pulses:
        - route: rpc
          method: post
          handler: PostRPC
          response: json
          concurrent: true
        - route: admin/reset
          method: post
          handler: PostReset
          auth: apikey
          response: json
      fields:
        - name: sequencer
          handler: Sequencer
    - name: bench
      pulses:
        - route: bench
          method: get
          handler: GetBench
          response: json

canvas:
  sites:
    - ./canvas

edge:
  site_auth:
    realm: fxevm testnode
    users:
      - user: drift
        password: $EXPLORER_PASS

backbone:
  sql:
    - name: chain
      schema: backbone/chain.sql
      seed: backbone/genesis.sql
  queues:
    - txs

tests:
  e2e:
    - make -C ../fxevm-source hardhat-tests
