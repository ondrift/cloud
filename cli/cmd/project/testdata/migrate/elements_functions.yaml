# A 1.19 Driftfile: one list of functions, each tagged with its element.
slice: shop

atomic:
  # Every function the shop runs.
  functions:
    # The storefront's one page.
    - route: menu
      method: get
      handler: GetMenu

    # Charges a card; lives with the payment code.
    - name: post:charge
      handler: PostCharge
      memory: 32MB
      element: payments   # the Go element

    - route: refund
      method: post
      handler: PostRefund
      element: payments

    - route: ping
      method: get
      handler: GetPing
      element: default

    # Thumbnails are Python.
    - element: images
      route: thumbs
      method: queue
      handler: thumbs_handler

backbone:
  queues:
    - thumbs

environments:
  prod: {}
  staging:
    atomic:
      functions:
        - route: charge
          method: post
          handler: PostCharge
          element: payments
