slice: shop
atomic:
  functions:
    - route: auth/challenge   # the login step
      method: post
      handler: PostChallenge
      memory: 32MB
    - {route: groups/:id, method: get, handler: GetGroup, memory: 16MB}
    - handler: Orders
      route: "orders"
      method: queue
      memory: 16MB
backbone:
  queues: [orders]
