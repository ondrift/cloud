slice: shop
atomic:
  functions:
    - route: ping
      method: get
      handler: GetPing
edge:
  egress:
    mode: open
environments:
  staging:
    # Staging may only reach the sandbox.
    atomic: {}
    edge:
      egress:
        mode: allowlist
        hosts: [api.sandbox.example.com]
  prod:
    edge:
      domains:
        - host: shop.example.com
