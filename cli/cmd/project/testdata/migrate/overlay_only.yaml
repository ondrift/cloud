slice: shop
atomic:
  pulses:
    - route: ping
      method: get
      handler: GetPing
edge:
  egress:
    mode: open
environments:
  staging:
    # Staging may only reach the sandbox.
    atomic:
      egress:
        mode: allowlist
        hosts: [api.sandbox.example.com]
  prod:
    domains:
      - host: shop.example.com
