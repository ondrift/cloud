slice: shop

atomic:
  # Every request the slice answers.
  functions: # one call, one result
    - route: ping
      method: get
      handler: GetPing
  fields:
    - name: sequencer
      handler: Sequencer

environments:
  staging:
    atomic:
      functions:
        - route: ping
          method: get
          handler: GetPingStaging
  prod: {}
