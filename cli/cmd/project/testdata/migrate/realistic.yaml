# Shop: the storefront and its API.

# Hostnames come first in this file, because they are what people ask about.
domains:
  - host: shop.example.com
  - host: www.shop.example.com

atomic:
  # Payments only; nothing else leaves the slice.
  egress: &payments
    mode: allowlist
    hosts:
      - api.stripe.com
  rate_limit: 600/min # across the whole slice
  functions:
    - name: get:ping # health check
      handler: GetPing
      memory: 16MB
    - name: post:orders
      handler: PostOrders
      memory: 64MB

backbone:
  nosql:
    - name: orders
      size: 1GB
      ttl: 720h

environments:
  staging:
    atomic:
      rate_limit: 60/min
      egress: *payments
  prod: {}

name: shop

canvas:
  sites:
    - dir: ./site
      route: /
